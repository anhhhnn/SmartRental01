name: .NET Core CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x' # Điền đúng version .NET của bạn (6.0.x, 7.0.x, 8.0.x)

    - name: Restore Dependencies
      run: dotnet restore
      working-directory: ./SmartRental # Trỏ vào thư mục con SmartRental

    - name: Build Project
      run: dotnet build --no-restore --configuration Release
      working-directory: ./SmartRental # Trỏ vào thư mục con SmartRental